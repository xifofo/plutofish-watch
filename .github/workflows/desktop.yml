name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::标签必须与 package.json 的版本一致：v$version"
            exit 1
          fi
      - name: Install offline media test tools
        timeout-minutes: 5
        run: |
          # Hosted runners can select an extremely slow Azure HTTP mirror.
          for mirror in /etc/apt/apt-mirrors*.txt; do
            if [ -f "$mirror" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirror"
            fi
          done
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm publisher:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
          - os: macos-latest
            target: --mac dmg --arm64 --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build installers
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for file in "PlutoFish-Watch-$version-windows-x64-setup.exe" \
            "PlutoFish-Watch-$version-macos-arm64.dmg" "PlutoFish-Watch-$version-macos-x64.dmg"; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          notes="docs/release-${GITHUB_REF_NAME}.md"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::已发布的版本不能覆盖；请递增版本并推送新标签"
              exit 1
            fi
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "PlutoFish Watch $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "PlutoFish Watch $version" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          if [ -f "$notes" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$notes"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
